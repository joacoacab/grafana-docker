global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']

  - job_name: traefik
    static_configs:
      - targets: ['traefik:8080']

  # node_exporter on the host — requires host.docker.internal resolution
  # (extra_hosts: host-gateway is set in docker-compose.yml)
  - job_name: node_exporter
    static_configs:
      - targets: ['host.docker.internal:9100']
