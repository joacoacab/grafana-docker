# Traefik v3 — Phase 2
# Env vars injected from docker-compose: TRAEFIK_ACME_EMAIL, INGESTA_BASIC_AUTH

api:
  dashboard: true
  insecure: true    # port 8080; block at firewall in production

log:
  level: WARN

accessLog: {}

metrics:
  prometheus: {}

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"

  # Dedicated entrypoint for Tempo OTLP HTTP (external agents)
  otlp-http:
    address: ":4318"

certificatesResolvers:
  letsencrypt:
    acme:
      email: ${TRAEFIK_ACME_EMAIL}
      storage: /acme.json
      # tlsChallenge works on port 443; compatible with the HTTP→HTTPS redirect above
      tlsChallenge: {}

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true
