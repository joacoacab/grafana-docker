# Traefik dynamic config — middlewares
# INGESTA_BASIC_AUTH is expanded from the Traefik container's environment
# (injected via docker-compose environment section from .env)
# Format: htpasswd -nb user pass   (single $ signs — no sed escaping needed)

http:
  middlewares:
    ingesta-auth:
      basicAuth:
        users:
          - "${INGESTA_BASIC_AUTH}"
    strip-prometheus:
      stripPrefix:
        prefixes:
          - "/prometheus"
